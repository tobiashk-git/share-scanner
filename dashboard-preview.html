<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundamentals Dashboard — Mockup</title>
<style>
  :root{
    --bg:#12233a; --panel:#182f4a; --panel2:#1e3a5c; --accent:#1f5496;
    --text:#e6edf5; --muted:#9fb2c8; --border:rgba(255,255,255,.10);
    --good:#4ecb96; --good-bg:rgba(78,203,150,.16);
    --bad:#e5889b;  --bad-bg:rgba(229,136,155,.14);
    --mid:#ffcf4d;  --mid-bg:rgba(255,207,77,.14);
    --mag:#5a9bd4;  --mag-track:rgba(255,255,255,.07);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0d1a2c;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:1.2rem .8rem 3rem;-webkit-text-size-adjust:100%;}
  .intro{max-width:430px;margin:0 auto 1.4rem;color:var(--muted);font-size:.85rem;line-height:1.5;text-align:center;}
  .intro b{color:var(--text);}
  /* each card = one stock's detail sheet dashboard */
  .card{max-width:430px;margin:0 auto 2rem;background:var(--bg);border:1px solid var(--border);
    border-radius:.9rem;overflow:hidden;}
  .head{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem .7rem;background:var(--accent);}
  .head .tk{font-size:1.3rem;font-weight:700;letter-spacing:.3px;}
  .head .nm{font-size:.8rem;color:#cfe0f5;margin-top:.1rem;}
  .head .sec{font-size:.68rem;color:#a9c4e6;margin-top:.15rem;}
  .ring{margin-left:auto;flex:none;text-align:center;}
  .ring .lbl{font-size:.58rem;color:#cfe0f5;margin-top:.1rem;letter-spacing:.4px;text-transform:uppercase;}
  .body{padding:.5rem 1rem 1.1rem;}
  .sec-t{font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
    font-weight:700;margin:1.1rem 0 .5rem;display:flex;align-items:center;gap:.4rem;}
  .sec-t::after{content:"";flex:1;height:1px;background:var(--border);}
  /* price position track */
  .track{position:relative;height:30px;margin:1.5rem 0 .3rem;}
  .track .bar{position:absolute;top:11px;left:0;right:0;height:8px;border-radius:4px;
    background:linear-gradient(90deg,var(--bad-bg),var(--mag-track) 55%,var(--good-bg));}
  .track .fill{position:absolute;top:11px;left:0;height:8px;border-radius:4px;background:var(--mag);opacity:.5;}
  .track .mk{position:absolute;top:5px;width:3px;height:20px;border-radius:2px;background:var(--text);}
  .track .mk.ath{background:var(--bad);}
  .track .cap{position:absolute;top:-14px;font-size:.62rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap;}
  .track .cap.val{top:30px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
  .headline{display:flex;align-items:baseline;gap:.5rem;margin:.2rem 0 .1rem;}
  .headline .big{font-size:1.9rem;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums;}
  .headline .cap{font-size:.72rem;color:var(--muted);}
  /* stat tiles row */
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .55rem;}
  .tile .k{font-size:.63rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile .v{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.15rem;}
  .tile .v small{font-size:.62rem;font-weight:500;color:var(--muted);}
  .tile.na .v{color:var(--muted);font-weight:500;font-size:.8rem;}
  .tile.good{border-color:rgba(78,203,150,.4);} .tile.good .v{color:var(--good);}
  .tile.bad .v{color:var(--bad);}
  /* horizontal metric bars */
  .mrow{display:grid;grid-template-columns:5.4rem 1fr 3.1rem;align-items:center;gap:.5rem;margin:.42rem 0;}
  .mrow .k{font-size:.75rem;color:var(--muted);}
  .mrow .barwrap{position:relative;height:14px;background:var(--mag-track);border-radius:7px;overflow:hidden;}
  .mrow .barwrap .f{position:absolute;left:0;top:0;height:100%;border-radius:7px;}
  .mrow .barwrap .thr{position:absolute;top:-2px;height:18px;width:2px;background:var(--muted);opacity:.6;}
  .mrow .v{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
  .mrow .v.na{color:var(--muted);font-weight:500;}
  .f.good{background:var(--good);} .f.mid{background:var(--mid);} .f.mag{background:var(--mag);}
  /* diverging growth */
  .dv{display:grid;grid-template-columns:6.5rem 1fr 1fr;align-items:center;gap:.3rem;margin:.5rem 0;}
  .dv .k{font-size:.75rem;color:var(--muted);}
  .dv .neg,.dv .pos{position:relative;height:16px;}
  .dv .neg{border-right:2px solid var(--border);}
  .dv .neg .f{position:absolute;right:0;top:0;height:100%;background:var(--bad);border-radius:4px 0 0 4px;}
  .dv .pos .f{position:absolute;left:0;top:0;height:100%;background:var(--good);border-radius:0 4px 4px 0;}
  .dv .lab{position:absolute;top:-1px;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;}
  .dv .pos .lab{left:6px;color:var(--good);} .dv .neg .lab{right:6px;color:var(--bad);}
  /* signal chips */
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem;}
  .chip{font-size:.72rem;font-weight:600;border-radius:.5rem;padding:.32rem .55rem;border:1px solid var(--border);}
  .chip.pass{background:var(--good-bg);color:var(--good);}
  .chip.fail{background:var(--bad-bg);color:var(--bad);}
  .note{background:var(--panel);border:1px solid var(--border);border-radius:.5rem;
    padding:.5rem .6rem;font-size:.72rem;color:var(--muted);margin-top:.5rem;}
</style>
</head>
<body>
  <div class="intro">
    <b>Fundamentals dashboard — layout mockup</b><br>
    This is what would open when you tap <b>📊 Charts</b> in a stock's detail sheet.
    Three real examples below: a top-quality name, a mid one, and a REIT with sparse data
    (to show how gaps are handled). All from the <b>current</b> snapshot — no new data yet.
  </div>
  <div id="cards"></div>

<script>
const STOCKS = [
  {Ticker:"ADBE",Name:"Adobe Inc.",Sector:"Information Technology",Sub:"Application Software",
   Price:264.02,ATH:688.37,BelowATH:61.6,Hi52:367.46,Lo52:193.41,Cap:104947949568,
   PE:15.1,FwdPE:9.6,PEG:0.66,PB:9.15,Div:null,Margin:28.7,RevG:12.7,EarnG:7.9,
   RevTrend:1,Profitable:1,ROE:63,ROIC:56.2,ROCE:46.6,DE:61.4,IntCov:34.2,Upside:2.1,Dilution:-9.3,LowDil:1,Q:12,Qd:12},
  {Ticker:"ERIE",Name:"Erie Indemnity",Sector:"Financials",Sub:"Insurance Brokers",
   Price:255.99,ATH:526.55,BelowATH:51.4,Hi52:360.43,Lo52:206.06,Cap:13385683968,
   PE:23.2,FwdPE:18.3,PEG:2.67,PB:5.43,Div:null,Margin:14,RevG:2.8,EarnG:3.2,
   RevTrend:1,Profitable:1,ROE:24.8,ROIC:29.2,ROCE:null,DE:2.6,IntCov:null,Upside:null,Dilution:0,LowDil:1,Q:9,Qd:9},
  {Ticker:"BBOX.L",Name:"Tritax Big Box REIT",Sector:"Real Estate",Sub:"REITs",
   Price:160.7,ATH:248.42,BelowATH:35.3,Hi52:173.28,Lo52:133.13,Cap:4370340864,
   PE:16.1,FwdPE:17,PEG:null,PB:0.87,Div:null,Margin:null,RevG:null,EarnG:null,
   RevTrend:0,Profitable:1,ROE:null,ROIC:null,ROCE:null,DE:null,IntCov:null,Upside:13.4,Dilution:35.1,LowDil:0,Q:2,Qd:4}
];

const na = '<span style="color:var(--muted)">n/a</span>';
const has = v => v!==null && v!==undefined;
const cap = v => { const a=Math.abs(v); if(a>=1e12)return (v/1e12).toFixed(2)+'T'; if(a>=1e9)return (v/1e9).toFixed(1)+'B'; if(a>=1e6)return (v/1e6).toFixed(0)+'M'; return v; };

function ring(q, qd){
  const pct = qd ? q/qd : 0, R=20, C=2*Math.PI*R, off=C*(1-pct);
  const col = pct>=0.75?'var(--good)':pct>=0.4?'var(--mid)':'var(--bad)';
  return `<div class="ring">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>
      <circle cx="26" cy="26" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 26 26)"/>
      <text x="26" y="24" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">${q}</text>
      <text x="26" y="35" text-anchor="middle" fill="var(--muted)" font-size="8">of ${qd}</text>
    </svg><div class="lbl">Quality</div></div>`;
}

// magnitude bar: value scaled to `max`, green above `thr`, else neutral
function mbar(label, v, unit, max, thr, higherBetter=true){
  if(!has(v)) return `<div class="mrow"><div class="k">${label}</div><div class="barwrap"></div><div class="v na">n/a</div></div>`;
  const w = Math.max(2, Math.min(100, (v/max)*100));
  const good = higherBetter ? v>=thr : v<=thr;
  const thrPct = Math.min(100,(thr/max)*100);
  return `<div class="mrow"><div class="k">${label}</div>
    <div class="barwrap"><div class="f ${good?'good':'mag'}" style="width:${w}%"></div>
      <div class="thr" style="left:${thrPct}%"></div></div>
    <div class="v">${v}${unit}</div></div>`;
}

function growth(label, v){
  if(!has(v)) return `<div class="dv"><div class="k">${label}</div><div class="neg"></div><div class="pos"><span class="lab" style="color:var(--muted)">n/a</span></div></div>`;
  const mag = Math.min(100, Math.abs(v)/25*100); // scale: 25% fills the half
  if(v>=0) return `<div class="dv"><div class="k">${label}</div><div class="neg"></div>
     <div class="pos"><div class="f" style="width:${mag}%"></div><span class="lab">▲ ${v}%</span></div></div>`;
  return `<div class="dv"><div class="k">${label}</div>
     <div class="neg"><div class="f" style="width:${mag}%"></div><span class="lab">▼ ${v}%</span></div><div class="pos"></div></div>`;
}

function tile(k, v, unit, cls=''){
  if(!has(v)) return `<div class="tile na"><div class="k">${k}</div><div class="v">n/a</div></div>`;
  return `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}<small>${unit||''}</small></div></div>`;
}

function priceTrack(s){
  const lo=s.Lo52, hi=s.Hi52, p=s.Price, ath=s.ATH;
  const span = ath-lo; const pos = x => Math.max(0,Math.min(100,((x-lo)/span)*100));
  return `<div class="track">
    <div class="bar"></div>
    <div class="fill" style="width:${pos(p)}%"></div>
    <div class="mk" style="left:${pos(p)}%"></div>
    <div class="mk ath" style="left:${pos(ath)}%"></div>
    <div class="cap" style="left:${pos(lo)}%">52w low</div>
    <div class="cap" style="left:${pos(hi)}%">52w high</div>
    <div class="cap ath" style="left:${pos(ath)}%;color:var(--bad)">ATH</div>
    <div class="cap val" style="left:${pos(p)}%">${p}</div>
  </div>`;
}

function card(s){
  const anyFund = has(s.ROE)||has(s.Margin)||has(s.ROIC);
  let html = `<div class="card">
    <div class="head"><div><div class="tk">${s.Ticker}</div><div class="nm">${s.Name}</div>
      <div class="sec">${s.Sector} · ${s.Sub}</div></div>${ring(s.Q,s.Qd)}</div>
    <div class="body">
      <div class="sec-t">Price vs range</div>
      ${priceTrack(s)}
      <div class="headline"><span class="big">−${s.BelowATH}%</span><span class="cap">below all-time high · mkt cap ${cap(s.Cap)}</span></div>

      <div class="sec-t">Valuation</div>
      <div class="tiles">
        ${tile('Trailing P/E', s.PE)}
        ${tile('Forward P/E', s.FwdPE, '', has(s.FwdPE)&&has(s.PE)&&s.FwdPE<s.PE?'good':'')}
        ${tile('PEG', s.PEG, '', has(s.PEG)&&s.PEG<1?'good':has(s.PEG)&&s.PEG>2?'bad':'')}
        ${tile('P/B', s.PB)}
        ${tile('Div Yield', s.Div, '%')}
        ${tile('Analyst upside', s.Upside, '%', has(s.Upside)&&s.Upside>0?'good':'')}
      </div>`;

  if(anyFund){
    html += `<div class="sec-t">Returns &amp; margin</div>
      ${mbar('ROE', s.ROE, '%', 60, 15)}
      ${mbar('ROIC', s.ROIC, '%', 60, 12)}
      ${mbar('ROCE', s.ROCE, '%', 60, 12)}
      ${mbar('Profit margin', s.Margin, '%', 40, 10)}
      <div class="sec-t">Growth (YoY)</div>
      ${growth('Revenue', s.RevG)}
      ${growth('Earnings', s.EarnG)}
      <div class="sec-t">Financial health</div>
      ${mbar('Debt/Equity', s.DE, '', 200, 100, false)}
      ${mbar('Int. cover', s.IntCov, '×', 40, 3)}`;
  } else {
    html += `<div class="note">Limited fundamentals reported for this name (common for REITs &amp; some financials). Showing price, valuation and quality signals only.</div>`;
  }

  html += `<div class="sec-t">Quality signals</div><div class="chips">
      <span class="chip ${s.RevTrend?'pass':'fail'}">${s.RevTrend?'✓':'✗'} Revenue trend</span>
      <span class="chip ${s.Profitable?'pass':'fail'}">${s.Profitable?'✓':'✗'} Historically profitable</span>
      <span class="chip ${s.LowDil?'pass':'fail'}">${s.LowDil?'✓':'✗'} Low dilution</span>
    </div></div></div>`;
  return html;
}

document.getElementById('cards').innerHTML = STOCKS.map(card).join('');
</script>
</body>
</html>
