<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Share Scanner</title>
  <meta name="theme-color" content="#1f5496">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root{
      --bg:#12233a; --panel:#182f4a; --panel2:#1e3a5c; --accent:#1f5496;
      --text:#e6edf5; --muted:#9fb2c8; --border:rgba(255,255,255,.09);
      --yes-bg:rgba(63,179,127,.20); --yes:#7ee0b0;
      --no-bg:rgba(217,100,122,.16); --no:#e5889b;
      --safe-t:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      -webkit-text-size-adjust:100%;}
    header{position:sticky;top:0;z-index:20;background:var(--accent);
      padding:calc(var(--safe-t) + .6rem) .9rem .6rem;box-shadow:0 1px 0 rgba(0,0,0,.25);}
    .hrow{display:flex;align-items:center;gap:.6rem;}
    .htitle{font-size:1.05rem;font-weight:650;letter-spacing:.2px;flex:1;}
    .hbtn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:.5rem;
      padding:.35rem .6rem;font-size:.8rem;font-weight:600;cursor:pointer;}
    .hbtn:active{background:rgba(255,255,255,.28);}
    .subtle{font-size:.72rem;color:#cfe0f5;margin-top:.25rem;}
    .subtle .warn{color:#ffd98a;}
    /* scan tabs */
    .tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.55rem .9rem;background:var(--panel);
      position:sticky;top:calc(var(--safe-t) + 2.9rem);z-index:15;border-bottom:1px solid var(--border);
      -webkit-overflow-scrolling:touch;}
    .tab{white-space:nowrap;background:transparent;border:1px solid var(--border);color:var(--muted);
      border-radius:999px;padding:.35rem .8rem;font-size:.8rem;font-weight:600;cursor:pointer;}
    .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .tab small{opacity:.7;font-weight:500;}
    /* controls */
    .controls{padding:.6rem .9rem;display:flex;flex-direction:column;gap:.55rem;background:var(--bg);}
    .search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
      border-radius:.6rem;padding:.55rem .7rem;font-size:.9rem;}
    .search::placeholder{color:var(--muted);}
    .crow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:.55rem;overflow:hidden;}
    .seg button{background:transparent;border:none;color:var(--muted);padding:.35rem .7rem;font-size:.78rem;font-weight:600;cursor:pointer;}
    .seg button.on{background:var(--accent);color:#fff;}
    .scorewrap{flex:1;min-width:160px;display:flex;align-items:center;gap:.55rem;}
    .scorewrap label{font-size:.75rem;color:var(--muted);white-space:nowrap;}
    .scorewrap input[type=range]{flex:1;accent-color:#3fb37f;}
    .scoreval{font-variant-numeric:tabular-nums;font-weight:700;min-width:1.4rem;text-align:center;}
    .count{font-size:.72rem;color:var(--muted);padding:0 .9rem .3rem;}
    /* table */
    .tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border);}
    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
      font-size:.8rem;font-variant-numeric:tabular-nums;}
    thead th{position:sticky;top:0;z-index:5;background:var(--panel2);color:#dbe8fa;
      font-weight:600;text-align:right;padding:.5rem .55rem;white-space:nowrap;cursor:pointer;
      border-bottom:1px solid var(--border);user-select:none;}
    thead th .arrow{opacity:.5;font-size:.7em;}
    tbody td{padding:.45rem .55rem;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border);}
    /* sticky first column (Ticker) */
    th.sticky,td.sticky{position:sticky;left:0;z-index:6;text-align:left;background:var(--panel);
      box-shadow:1px 0 0 var(--border);font-weight:600;}
    thead th.sticky{z-index:8;background:var(--panel2);}
    tbody tr:nth-child(2n) td{background:rgba(255,255,255,.02);}
    tbody tr:nth-child(2n) td.sticky{background:#1a3352;}
    .yes{color:var(--yes);background:var(--yes-bg);border-radius:.35rem;padding:.05rem .4rem;font-weight:700;}
    .no{color:var(--no);background:var(--no-bg);border-radius:.35rem;padding:.05rem .4rem;}
    .muted{color:var(--muted);}
    td.score .pill{display:inline-block;min-width:1.4rem;text-align:center;border-radius:.35rem;padding:.05rem .4rem;font-weight:700;}
    .s-hi{background:var(--yes-bg);color:var(--yes);}
    .s-mid{background:rgba(255,214,138,.15);color:#ffd98a;}
    .s-lo{background:var(--no-bg);color:var(--no);}
    .name{max-width:12rem;overflow:hidden;text-overflow:ellipsis;}
    /* states */
    .msg{padding:2.5rem 1.5rem;text-align:center;color:var(--muted);}
    .spinner{width:1.6rem;height:1.6rem;border:3px solid var(--border);border-top-color:#7ee0b0;
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
    @keyframes spin{to{transform:rotate(360deg)}}
    tbody tr{cursor:pointer;}
    tbody tr:active td{background:rgba(126,224,176,.10);}
    tbody tr:active td.sticky{background:#204066;}
    .hint{font-size:.7rem;color:var(--muted);padding:0 .9rem .4rem;font-style:italic;}
    /* detail sheet */
    .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;}
    .sheet[hidden]{display:none;}
    .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .18s ease;}
    .sheet-card{position:relative;width:100%;max-width:34rem;max-height:92vh;background:var(--bg);
      border-radius:1rem 1rem 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;
      animation:slideup .22s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0);}
    @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .grip{width:2.4rem;height:.28rem;background:var(--border);border-radius:999px;margin:.55rem auto .2rem;}
    .sheet-head{display:flex;align-items:flex-start;gap:.6rem;padding:.3rem 1rem .1rem;}
    .sheet-head .tk{font-size:1.25rem;font-weight:700;letter-spacing:.3px;}
    .sheet-head .nm{color:var(--muted);font-size:.85rem;margin-top:.1rem;}
    .sheet-head .close{margin-left:auto;background:var(--panel);border:1px solid var(--border);color:var(--text);
      width:2rem;height:2rem;border-radius:50%;font-size:1rem;cursor:pointer;flex:none;}
    .sheet-sub{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.35rem 1rem .7rem;}
    .badge{font-size:.72rem;color:var(--muted);background:var(--panel);border:1px solid var(--border);
      border-radius:999px;padding:.15rem .55rem;}
    .bigscore{margin-left:auto;font-weight:700;font-size:.8rem;border-radius:.5rem;padding:.25rem .6rem;}
    .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 1rem 1.2rem;}
    .sec-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
      margin:1rem 0 .5rem;font-weight:700;}
    .signals{display:flex;flex-wrap:wrap;gap:.4rem;}
    .sig{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;border-radius:.5rem;
      padding:.3rem .55rem;border:1px solid var(--border);}
    .sig.pass{background:var(--yes-bg);color:var(--yes);}
    .sig.fail{background:var(--no-bg);color:var(--no);}
    .sig.unk{background:var(--panel);color:var(--muted);}
    .metrics{display:grid;grid-template-columns:1fr auto;gap:.05rem .8rem;}
    .metrics .k{padding:.42rem 0;color:var(--muted);font-size:.83rem;border-bottom:1px solid var(--border);}
    .metrics .v{padding:.42rem 0;text-align:right;font-variant-numeric:tabular-nums;font-size:.86rem;
      border-bottom:1px solid var(--border);font-weight:600;}
    .notes{margin-top:.8rem;background:var(--panel);border:1px solid var(--border);border-radius:.6rem;
      padding:.6rem .7rem;font-size:.8rem;color:#ffd98a;}
    details.method{margin-top:1rem;border-top:1px solid var(--border);padding-top:.6rem;}
    details.method summary{cursor:pointer;font-size:.8rem;color:var(--muted);font-weight:600;list-style:none;}
    details.method summary::-webkit-details-marker{display:none;}
    details.method summary::before{content:"▸ ";}
    details.method[open] summary::before{content:"▾ ";}
    .method dt{font-size:.78rem;font-weight:700;margin-top:.6rem;color:#cfe0f5;}
    .method dd{font-size:.76rem;color:var(--muted);margin:.15rem 0 0;line-height:1.4;}
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <div class="htitle">Share Scanner</div>
      <button class="hbtn" id="refresh">↻ Refresh</button>
    </div>
    <div class="subtle" id="dataAge">Loading…</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="controls" id="controls" style="display:none">
    <input class="search" id="search" type="search" placeholder="Search ticker or name…" autocomplete="off" autocapitalize="characters">
    <div class="crow">
      <div class="seg" id="market"></div>
      <div class="scorewrap">
        <label id="scoreLabel">Score ≥</label>
        <input type="range" id="score" min="0" max="4" step="1" value="0">
        <span class="scoreval" id="scoreVal">0</span>
      </div>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div class="hint" id="hint"></div>

  <div class="tablewrap"><div id="table"></div></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-card">
      <div class="grip"></div>
      <div class="sheet-head">
        <div>
          <div class="tk" id="dTk"></div>
          <div class="nm" id="dNm"></div>
        </div>
        <button class="close" id="dClose" aria-label="Close">✕</button>
      </div>
      <div class="sheet-sub" id="dSub"></div>
      <div class="sheet-body" id="dBody"></div>
    </div>
  </div>

  <script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const HIDDEN_COLS = new Set(["Notes/Error"]); // don't clutter the table with mostly-empty error text

  const state = {
    data: null,
    scanKey: null,
    minScore: 0,
    market: "All",
    query: "",
    sortCol: null,
    sortDir: "desc",
  };

  // ---- data loading (network-first; falls back to last saved copy offline) ----
  async function loadData(force) {
    try {
      const resp = await fetch("results.json", { cache: force ? "no-store" : "default" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      localStorage.setItem("scanner_data", JSON.stringify(data));
      applyData(data, false);
    } catch (e) {
      const saved = localStorage.getItem("scanner_data");
      if (saved) {
        applyData(JSON.parse(saved), true);
      } else {
        $("dataAge").textContent = "Couldn't load scan data (offline, nothing saved yet).";
        $("table").innerHTML = '<div class="msg">No data available.<br>Connect to the internet once to load the latest scans.</div>';
      }
    }
  }

  function applyData(data, offline) {
    state.data = data;
    if (!state.scanKey || !data.scans[state.scanKey]) {
      state.scanKey = Object.keys(data.scans)[0];
    }
    $("dataAge").innerHTML = (offline ? '<span class="warn">Offline · </span>' : "") +
      "Published " + relAge(data.generated_at);
    renderTabs();
    resetControlsForScan();
    render();
  }

  // ---- helpers ----
  function relAge(iso) {
    if (!iso) return "unknown";
    const shown = iso.replace("T", " ").slice(0, 16);
    const then = new Date(iso), now = new Date();
    if (isNaN(then)) return shown;
    const days = Math.floor((now - then) / 86400000);
    let ago;
    if (days <= 0) {
      const hrs = Math.floor((now - then) / 3600000);
      ago = hrs <= 0 ? "just now" : hrs + "h ago";
    } else {
      ago = days === 1 ? "yesterday" : days + "d ago";
    }
    const stale = days >= 3 ? ' <span class="warn">· may be stale</span>' : "";
    return shown + " (" + ago + ")" + stale;
  }

  const isBoolCol = (col) => col.trim().endsWith("?");
  const isCapCol  = (col) => /cap/i.test(col);

  function scanMax(scan) {
    let m = 0;
    for (const r of scan.rows) {
      const v = r[scan.score_field];
      if (typeof v === "number" && v > m) m = v;
    }
    return m || 4;
  }

  function fmtCap(v) {
    const a = Math.abs(v);
    if (a >= 1e12) return (v/1e12).toFixed(2) + "T";
    if (a >= 1e9)  return (v/1e9 ).toFixed(2) + "B";
    if (a >= 1e6)  return (v/1e6 ).toFixed(1) + "M";
    return v.toLocaleString();
  }

  function cellHTML(col, v, scoreField, sMax) {
    if (v === null || v === undefined || v === "") return '<span class="muted">—</span>';
    if (isBoolCol(col)) {
      const truthy = v === true || v === 1 || v === "TRUE" || v === "True";
      const falsy  = v === false || v === 0 || v === "FALSE" || v === "False";
      if (truthy) return '<span class="yes">✓</span>';
      if (falsy)  return '<span class="no">✗</span>';
      return '<span class="muted">—</span>';
    }
    if (col === scoreField && typeof v === "number") {
      const ratio = sMax ? v / sMax : 0;
      const cls = ratio >= 0.66 ? "s-hi" : ratio <= 0.33 ? "s-lo" : "s-mid";
      return '<span class="pill ' + cls + '">' + v + "</span>";
    }
    if (typeof v === "number") {
      if (isCapCol(col)) return fmtCap(v);
      if (Number.isInteger(v) && Math.abs(v) >= 10000) return v.toLocaleString();
      return String(v);
    }
    return String(v);
  }

  // ---- rendering ----
  function renderTabs() {
    const tabs = $("tabs");
    tabs.innerHTML = "";
    for (const [key, scan] of Object.entries(state.data.scans)) {
      const b = document.createElement("button");
      b.className = "tab" + (key === state.scanKey ? " active" : "");
      const label = shortTitle(scan.title);
      b.innerHTML = label + " <small>" + scan.rows.length + "</small>";
      b.onclick = () => { state.scanKey = key; resetControlsForScan(); render(); renderTabs(); };
      tabs.appendChild(b);
    }
  }

  function shortTitle(t) {
    if (/watchlist/i.test(t)) return "Watchlist";
    if (/broad/i.test(t)) return "150 Strategy";
    if (/oversold/i.test(t)) return "Oversold Strategy";
    return t.split(" ")[0];
  }

  function resetControlsForScan() {
    const scan = state.data.scans[state.scanKey];
    const sMax = scanMax(scan);
    // default: show a shortlist near the top (max-1), user can slide down to 0
    state.minScore = Math.max(0, sMax - 1);
    state.market = "All";
    state.query = "";
    state.sortCol = scan.score_field;
    state.sortDir = "desc";

    $("controls").style.display = "flex";
    $("search").value = "";

    // market segmented control
    const markets = ["All", ...Array.from(new Set(scan.rows.map(r => r.Market).filter(Boolean))).sort()];
    const seg = $("market");
    seg.innerHTML = "";
    for (const m of markets) {
      const b = document.createElement("button");
      b.textContent = m;
      b.className = m === state.market ? "on" : "";
      b.onclick = () => { state.market = m; syncSeg(); render(); };
      seg.appendChild(b);
    }
    // score slider
    const sl = $("score");
    sl.max = sMax; sl.value = state.minScore;
    $("scoreVal").textContent = state.minScore;
    $("scoreLabel").textContent = (scan.score_field.includes("Quality") ? "Quality ≥" : "Score ≥");
  }

  function syncSeg() {
    [...$("market").children].forEach(b => b.className = b.textContent === state.market ? "on" : "");
  }

  function currentRows() {
    const scan = state.data.scans[state.scanKey];
    const sf = scan.score_field;
    const q = state.query.trim().toLowerCase();
    let rows = scan.rows.filter(r => {
      const sv = r[sf];
      if (typeof sv !== "number") return false;         // drop failed/errored rows
      if (q) {
        // An explicit ticker/name search finds the stock regardless of the
        // score slider or market toggle - otherwise a low-scorer looks "missing".
        const hay = ((r.Ticker || "") + " " + (r.Name || "")).toLowerCase();
        return hay.includes(q);
      }
      if (sv < state.minScore) return false;
      if (state.market !== "All" && r.Market !== state.market) return false;
      return true;
    });
    const col = state.sortCol, dir = state.sortDir === "asc" ? 1 : -1;
    rows.sort((a, b) => {
      let x = a[col], y = b[col];
      const xn = (x === null || x === undefined || x === ""), yn = (y === null || y === undefined || y === "");
      if (xn && yn) return 0;
      if (xn) return 1;        // nulls always last
      if (yn) return -1;
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y)) * dir;
    });
    return rows;
  }

  function render() {
    const scan = state.data.scans[state.scanKey];
    const sf = scan.score_field;
    const sMax = scanMax(scan);
    // column order: Ticker, Name, <score>, then the rest (minus hidden & dupes)
    let cols = scan.columns.filter(c => !HIDDEN_COLS.has(c));
    const front = ["Ticker", "Name", sf];
    cols = [...front.filter(c => cols.includes(c)), ...cols.filter(c => !front.includes(c))];

    const rows = currentRows();
    $("count").textContent = rows.length + " of " +
      scan.rows.filter(r => typeof r[sf] === "number").length + " shown" +
      (scan.last_run ? "  ·  scan run " + scan.last_run : "");

    let html = "<table><thead><tr>";
    cols.forEach((c, i) => {
      const arrow = c === state.sortCol ? (state.sortDir === "asc" ? " ▲" : " ▼") : "";
      html += '<th class="' + (i === 0 ? "sticky" : "") + '" data-col="' + esc(c) + '">' +
              esc(c) + '<span class="arrow">' + arrow + "</span></th>";
    });
    html += "</tr></thead><tbody>";
    rows.forEach((r, ri) => {
      html += '<tr data-idx="' + ri + '">';
      cols.forEach((c, i) => {
        let cls = i === 0 ? "sticky" : "";
        if (c === "Name") cls += " name";
        if (c === sf) cls += " score";
        html += '<td class="' + cls.trim() + '">' + cellHTML(c, r[c], sf, sMax) + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    if (rows.length === 0) html = '<div class="msg">No matches. Lower the score filter or clear the search.</div>';
    $("table").innerHTML = html;

    // header sort handlers
    document.querySelectorAll("thead th").forEach(th => {
      th.onclick = () => {
        const c = th.getAttribute("data-col");
        if (state.sortCol === c) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        else { state.sortCol = c; state.sortDir = (c === "Ticker" || c === "Name") ? "asc" : "desc"; }
        render();
      };
    });
    // row tap -> detail sheet
    document.querySelectorAll("tbody tr[data-idx]").forEach(tr => {
      tr.onclick = () => openDetail(rows[+tr.getAttribute("data-idx")]);
    });
    $("hint").textContent = rows.length ? "Tap any row for the full breakdown" : "";
  }

  // ---- detail sheet ----
  function openDetail(r) {
    const scan = state.data.scans[state.scanKey];
    const sf = scan.score_field;
    const sMax = scanMax(scan);
    const cols = scan.columns;

    $("dTk").textContent = r.Ticker || "";
    $("dNm").textContent = r.Name || "";

    // sub-line: market · sector · sub-industry + score pill
    const bits = ["Market", "Sector", "Sub-Industry"]
      .map(k => r[k]).filter(v => v && String(v).trim());
    const sv = r[sf];
    const ratio = (typeof sv === "number" && sMax) ? sv / sMax : 0;
    const scls = ratio >= 0.66 ? "s-hi" : ratio <= 0.33 ? "s-lo" : "s-mid";
    $("dSub").innerHTML =
      bits.map(b => '<span class="badge">' + esc(b) + "</span>").join("") +
      (typeof sv === "number"
        ? '<span class="bigscore ' + scls + '">' + esc(sf.replace(/\s*\(.*\)/, "")) + ": " + sv + "</span>"
        : "");

    const identity = new Set(["Ticker", "Name", "Market", "Sector", "Sub-Industry", sf, "Notes/Error"]);
    const signalCols = cols.filter(c => isBoolCol(c));
    const metricCols = cols.filter(c => !identity.has(c) && !isBoolCol(c));

    let html = "";
    if (signalCols.length) {
      html += '<div class="sec-title">Signals</div><div class="signals">';
      for (const c of signalCols) {
        const v = r[c];
        const truthy = v === true || v === 1 || v === "TRUE" || v === "True";
        const falsy  = v === false || v === 0 || v === "FALSE" || v === "False";
        const cls = truthy ? "pass" : falsy ? "fail" : "unk";
        const mark = truthy ? "✓" : falsy ? "✗" : "—";
        html += '<span class="sig ' + cls + '">' + mark + " " + esc(c.replace(/\?$/, "")) + "</span>";
      }
      html += "</div>";
    }
    if (metricCols.length) {
      html += '<div class="sec-title">Metrics</div><div class="metrics">';
      for (const c of metricCols) {
        html += '<div class="k">' + esc(c) + '</div><div class="v">' +
                cellHTML(c, r[c], sf, sMax) + "</div>";
      }
      html += "</div>";
    }
    const note = r["Notes/Error"];
    if (note && String(note).trim()) {
      html += '<div class="notes">' + esc(String(note)) + "</div>";
    }
    if (scan.legend && scan.legend.length) {
      html += '<details class="method"><summary>What these mean</summary><dl class="method">';
      for (const [field, def] of scan.legend) {
        html += "<dt>" + esc(field) + "</dt><dd>" + esc(def) + "</dd>";
      }
      html += "</dl></details>";
    }
    $("dBody").innerHTML = html;
    $("dBody").scrollTop = 0;
    $("sheet").hidden = false;
  }

  function closeDetail() { $("sheet").hidden = true; }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // ---- events ----
  $("search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
  $("score").addEventListener("input", (e) => {
    state.minScore = +e.target.value; $("scoreVal").textContent = e.target.value; render();
  });
  $("refresh").addEventListener("click", () => { $("dataAge").textContent = "Refreshing…"; loadData(true); });
  $("dClose").addEventListener("click", closeDetail);
  $("sheetBackdrop").addEventListener("click", closeDetail);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

  // ---- boot ----
  loadData(false);
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
  </script>
</body>
</html>
