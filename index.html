<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Share Scanner</title>
  <meta name="theme-color" content="#1f5496">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scanner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root{
      --bg:#12233a; --panel:#182f4a; --panel2:#1e3a5c; --accent:#1f5496;
      --text:#e6edf5; --muted:#9fb2c8; --border:rgba(255,255,255,.09);
      --yes-bg:rgba(63,179,127,.20); --yes:#7ee0b0;
      --no-bg:rgba(217,100,122,.16); --no:#e5889b;
      --safe-t:env(safe-area-inset-top,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      -webkit-text-size-adjust:100%;}
    header{position:sticky;top:0;z-index:20;background:var(--accent);
      padding:calc(var(--safe-t) + .6rem) .9rem .6rem;box-shadow:0 1px 0 rgba(0,0,0,.25);}
    .hrow{display:flex;align-items:center;gap:.6rem;}
    .htitle{font-size:1.05rem;font-weight:650;letter-spacing:.2px;flex:1;}
    .hbtn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:.5rem;
      padding:.35rem .6rem;font-size:.8rem;font-weight:600;cursor:pointer;}
    .hbtn:active{background:rgba(255,255,255,.28);}
    .subtle{font-size:.72rem;color:#cfe0f5;margin-top:.25rem;}
    .subtle .warn{color:#ffd98a;}
    /* scan tabs */
    .tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.55rem .9rem;background:var(--panel);
      position:sticky;top:calc(var(--safe-t) + 2.9rem);z-index:15;border-bottom:1px solid var(--border);
      -webkit-overflow-scrolling:touch;}
    .tab{white-space:nowrap;background:transparent;border:1px solid var(--border);color:var(--muted);
      border-radius:999px;padding:.35rem .8rem;font-size:.8rem;font-weight:600;cursor:pointer;}
    .tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
    .tab small{opacity:.7;font-weight:500;}
    /* controls */
    .controls{padding:.6rem .9rem;display:flex;flex-direction:column;gap:.55rem;background:var(--bg);}
    .search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
      border-radius:.6rem;padding:.55rem .7rem;font-size:.9rem;}
    .search::placeholder{color:var(--muted);}
    .crow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
    .seg{display:inline-flex;background:var(--panel);border:1px solid var(--border);border-radius:.55rem;overflow:hidden;}
    .seg button{background:transparent;border:none;color:var(--muted);padding:.35rem .7rem;font-size:.78rem;font-weight:600;cursor:pointer;}
    .seg button.on{background:var(--accent);color:#fff;}
    .scorewrap{flex:1;min-width:160px;display:flex;align-items:center;gap:.55rem;}
    .scorewrap label{font-size:.75rem;color:var(--muted);white-space:nowrap;}
    .scorewrap input[type=range]{flex:1;accent-color:#3fb37f;}
    .scoreval{font-variant-numeric:tabular-nums;font-weight:700;min-width:1.4rem;text-align:center;}
    .count{font-size:.72rem;color:var(--muted);padding:0 .9rem .3rem;}
    /* table */
    .tablewrap{overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border);}
    table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;
      font-size:.8rem;font-variant-numeric:tabular-nums;}
    thead th{position:sticky;top:0;z-index:5;background:var(--panel2);color:#dbe8fa;
      font-weight:600;text-align:center;vertical-align:bottom;padding:.5rem .4rem;
      white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--border);user-select:none;}
    thead th .arrow{opacity:.5;font-size:.7em;}
    /* Cap header text width so multi-word headers WRAP (shrinking the column).
       Needed because the table is max-content, which otherwise never wraps. */
    .thw{display:inline-block;max-width:4.2rem;white-space:normal;line-height:1.15;vertical-align:bottom;}
    tbody td{padding:.45rem .5rem;text-align:center;white-space:nowrap;border-bottom:1px solid var(--border);}
    /* sticky first column (Ticker) */
    th.sticky,td.sticky{position:sticky;left:0;z-index:6;text-align:left;background:var(--panel);
      box-shadow:1px 0 0 var(--border);font-weight:600;}
    thead th.sticky{z-index:8;background:var(--panel2);}
    tbody tr:nth-child(2n) td{background:rgba(255,255,255,.02);}
    tbody tr:nth-child(2n) td.sticky{background:#1a3352;}
    .yes{color:var(--yes);background:var(--yes-bg);border-radius:.35rem;padding:.05rem .4rem;font-weight:700;}
    .no{color:var(--no);background:var(--no-bg);border-radius:.35rem;padding:.05rem .4rem;}
    .muted{color:var(--muted);}
    td.score .pill{display:inline-block;min-width:1.4rem;text-align:center;border-radius:.35rem;padding:.05rem .4rem;font-weight:700;}
    .s-hi{background:var(--yes-bg);color:var(--yes);}
    .s-mid{background:rgba(255,214,138,.15);color:#ffd98a;}
    .s-lo{background:var(--no-bg);color:var(--no);}
    .name{max-width:11rem;overflow:hidden;text-overflow:ellipsis;text-align:left;}
    thead th.name{white-space:nowrap;}
    /* states */
    .msg{padding:2.5rem 1.5rem;text-align:center;color:var(--muted);}
    .spinner{width:1.6rem;height:1.6rem;border:3px solid var(--border);border-top-color:#7ee0b0;
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
    @keyframes spin{to{transform:rotate(360deg)}}
    tbody tr{cursor:pointer;}
    tbody tr:active td{background:rgba(126,224,176,.10);}
    tbody tr:active td.sticky{background:#204066;}
    .hint{font-size:.7rem;color:var(--muted);padding:0 .9rem .4rem;font-style:italic;}
    /* detail sheet */
    .sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;}
    .sheet[hidden]{display:none;}
    .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .18s ease;}
    .sheet-card{position:relative;width:100%;max-width:34rem;max-height:92vh;background:var(--bg);
      border-radius:0 0 1rem 1rem;box-shadow:0 8px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;
      animation:slidedown .22s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0);}
    @keyframes slidedown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    .grip{width:2.4rem;height:.28rem;background:var(--border);border-radius:999px;margin:.55rem auto .2rem;}
    .sheet-head{display:flex;align-items:flex-start;gap:.6rem;padding:.3rem 1rem .1rem;}
    .sheet-head .tk{font-size:1.25rem;font-weight:700;letter-spacing:.3px;}
    .sheet-head .nm{color:var(--muted);font-size:.85rem;margin-top:.1rem;}
    .sheet-head .close{margin-left:auto;background:var(--panel);border:1px solid var(--border);color:var(--text);
      width:2rem;height:2rem;border-radius:50%;font-size:1rem;cursor:pointer;flex:none;}
    .sheet-sub{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.35rem 1rem .7rem;}
    .badge{font-size:.72rem;color:var(--muted);background:var(--panel);border:1px solid var(--border);
      border-radius:999px;padding:.15rem .55rem;}
    .bigscore{margin-left:auto;font-weight:700;font-size:.8rem;border-radius:.5rem;padding:.25rem .6rem;}
    .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 1rem 1.2rem;}
    .sec-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
      margin:1rem 0 .5rem;font-weight:700;}
    .signals{display:flex;flex-wrap:wrap;gap:.4rem;}
    .sig{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;border-radius:.5rem;
      padding:.3rem .55rem;border:1px solid var(--border);}
    .sig.pass{background:var(--yes-bg);color:var(--yes);}
    .sig.fail{background:var(--no-bg);color:var(--no);}
    .sig.unk{background:var(--panel);color:var(--muted);}
    .metrics{display:grid;grid-template-columns:1fr auto;gap:.05rem .8rem;}
    .metrics .k{padding:.42rem 0;color:var(--muted);font-size:.83rem;border-bottom:1px solid var(--border);}
    .metrics .v{padding:.42rem 0;text-align:right;font-variant-numeric:tabular-nums;font-size:.86rem;
      border-bottom:1px solid var(--border);font-weight:600;}
    .notes{margin-top:.8rem;background:var(--panel);border:1px solid var(--border);border-radius:.6rem;
      padding:.6rem .7rem;font-size:.8rem;color:#ffd98a;}
    details.method{margin-top:1rem;border-top:1px solid var(--border);padding-top:.6rem;}
    details.method summary{cursor:pointer;font-size:.8rem;color:var(--muted);font-weight:600;list-style:none;}
    details.method summary::-webkit-details-marker{display:none;}
    details.method summary::before{content:"▸ ";}
    details.method[open] summary::before{content:"▾ ";}
    .method dt{font-size:.78rem;font-weight:700;margin-top:.6rem;color:#cfe0f5;}
    .method dd{font-size:.76rem;color:var(--muted);margin:.15rem 0 0;line-height:1.4;}
    /* watchlist star + stale */
    .star{display:inline-block;width:1.25rem;text-align:center;cursor:pointer;font-size:1.02rem;
      color:var(--muted);-webkit-tap-highlight-color:transparent;user-select:none;}
    .star.on{color:#ffcf4d;}
    .tkcell{display:inline-flex;align-items:center;gap:.25rem;}
    .staleflag{color:#ffd98a;margin-left:.25rem;font-size:.82em;}
    tbody tr.stale td:not(.sticky){opacity:.6;}
    .tab small.wl{color:#ffcf4d;}
    /* watch toggle + stale banner in detail sheet */
    .watchbtn{display:inline-flex;align-items:center;gap:.4rem;margin:.4rem 0 .2rem;
      background:var(--panel);border:1px solid var(--border);color:var(--text);
      border-radius:.6rem;padding:.5rem .85rem;font-size:.85rem;font-weight:600;cursor:pointer;}
    .watchbtn.on{background:rgba(255,207,77,.16);border-color:rgba(255,207,77,.45);color:#ffcf4d;}
    .stalebanner{margin:.5rem 0 .2rem;background:rgba(255,217,138,.12);border:1px solid rgba(255,217,138,.3);
      border-radius:.6rem;padding:.5rem .7rem;font-size:.78rem;color:#ffd98a;}
    .emptywl{padding:2.5rem 1.5rem;text-align:center;color:var(--muted);line-height:1.6;}
    .emptywl .big{font-size:1.6rem;display:block;margin-bottom:.5rem;}
    /* per-stock actions (copy / chart) */
    .actions{display:flex;gap:.5rem;margin:.5rem 0 .15rem;flex-wrap:wrap;}
    .actbtn{display:inline-flex;align-items:center;gap:.35rem;background:var(--panel);
      border:1px solid var(--border);color:var(--text);border-radius:.6rem;
      padding:.5rem .85rem;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:none;}
    .actbtn:active{background:var(--panel2);}
    .acthint{font-size:.72rem;color:var(--muted);margin:.1rem 0 .2rem;}
    #toast{position:fixed;left:50%;bottom:2.4rem;transform:translateX(-50%) translateY(1rem);
      background:#0c1626;border:1px solid var(--border);color:var(--text);padding:.55rem .95rem;
      border-radius:.6rem;font-size:.85rem;font-weight:600;opacity:0;pointer-events:none;
      transition:opacity .2s,transform .2s;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.5);}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    /* detail view toggle (Numbers | Charts) */
    .viewtoggle{display:inline-flex;background:var(--panel);border:1px solid var(--border);
      border-radius:.55rem;overflow:hidden;margin:.5rem 0 .2rem;}
    .viewtoggle button{background:transparent;border:none;color:var(--muted);padding:.4rem .8rem;
      font-size:.8rem;font-weight:600;cursor:pointer;}
    .viewtoggle button.on{background:var(--accent);color:#fff;}
    /* ---- fundamentals dashboard (scoped) ---- */
    .dash{--good:#4ecb96;--good-bg:rgba(78,203,150,.16);--bad:#e5889b;--bad-bg:rgba(229,136,155,.14);
      --dmid:#ffcf4d;--mag:#5a9bd4;--mtrack:rgba(255,255,255,.07);margin-top:.6rem;}
    .dash .st{font-size:.68rem;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
      font-weight:700;margin:1.1rem 0 .5rem;display:flex;align-items:center;gap:.4rem;}
    .dash .st::after{content:"";flex:1;height:1px;background:var(--border);}
    .dash .track{position:relative;height:30px;margin:2.1rem 0 1.7rem;}
    .dash .track .bar{position:absolute;top:11px;left:0;right:0;height:8px;border-radius:4px;
      background:linear-gradient(90deg,var(--bad-bg),var(--mtrack) 55%,var(--good-bg));}
    .dash .track .fill{position:absolute;top:11px;left:0;height:8px;border-radius:4px;background:var(--mag);opacity:.5;}
    .dash .track .mk{position:absolute;top:5px;width:3px;height:20px;border-radius:2px;background:var(--text);}
    .dash .track .mk.ath{background:var(--bad);}
    .dash .track .cap{position:absolute;top:-14px;font-size:.62rem;color:var(--muted);transform:translateX(-50%);white-space:nowrap;}
    .dash .track .cap.val{top:30px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
    .dash .headline{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 .1rem;}
    .dash .headline .big{font-size:1.9rem;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums;}
    .dash .headline .cap{font-size:.72rem;color:var(--muted);}
    .dash .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;}
    .dash .tile{background:var(--panel);border:1px solid var(--border);border-radius:.5rem;padding:.5rem .55rem;}
    .dash .tile .tk{font-size:.63rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .dash .tile .tv{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.15rem;}
    .dash .tile .tv small{font-size:.62rem;font-weight:500;color:var(--muted);}
    .dash .tile.na .tv{color:var(--muted);font-weight:500;font-size:.8rem;}
    .dash .tile.good{border-color:rgba(78,203,150,.4);} .dash .tile.good .tv{color:var(--good);}
    .dash .tile.bad .tv{color:var(--bad);}
    .dash .mrow{display:grid;grid-template-columns:5.4rem 1fr 4.3rem;align-items:center;gap:.5rem;margin:.42rem 0;}
    .dash .mrow .mk2{font-size:.75rem;color:var(--muted);}
    .dash .mrow .bw{position:relative;height:14px;background:var(--mtrack);border-radius:7px;overflow:hidden;}
    .dash .mrow .bw .f{position:absolute;left:0;top:0;height:100%;border-radius:7px;}
    .dash .mrow .bw .thr{position:absolute;top:-2px;height:18px;width:2px;background:var(--muted);opacity:.6;}
    .dash .mrow .mv{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .dash .mrow .mv.na{color:var(--muted);font-weight:500;}
    .dash .f.good{background:var(--good);} .dash .f.mid{background:var(--dmid);} .dash .f.mag{background:var(--mag);}
    .dash .dv{display:grid;grid-template-columns:5.4rem 1fr 1fr 4.3rem;align-items:center;gap:.3rem;margin:.5rem 0;}
    .dash .dv .dk{font-size:.75rem;color:var(--muted);}
    .dash .dv .neg,.dash .dv .pos{position:relative;height:16px;}
    .dash .dv .neg{border-right:2px solid var(--border);}
    .dash .dv .neg .f{position:absolute;right:0;top:0;height:100%;background:var(--bad);border-radius:4px 0 0 4px;}
    .dash .dv .pos .f{position:absolute;left:0;top:0;height:100%;background:var(--good);border-radius:0 4px 4px 0;}
    .dash .dv .dvv{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .dash .dv .dvv.up{color:var(--good);} .dash .dv .dvv.down{color:var(--bad);} .dash .dv .dvv.na{color:var(--muted);font-weight:500;}
    .dash .dnote{background:var(--panel);border:1px solid var(--border);border-radius:.5rem;
      padding:.5rem .6rem;font-size:.72rem;color:var(--muted);margin-top:.5rem;}
    /* multi-year trend rows (sparklines) */
    .dash .trow{display:grid;grid-template-columns:5.4rem 1fr 4.3rem;align-items:center;gap:.5rem;margin:.55rem 0;}
    .dash .trow .tk2{font-size:.75rem;color:var(--muted);}
    .dash .trow .spark{width:100%;height:26px;display:block;}
    .dash .trow .tvv{font-size:.78rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .dash .trow .tvv.up{color:var(--good);} .dash .trow .tvv.down{color:var(--bad);} .dash .trow .tvv.na{color:var(--muted);font-weight:500;}
    .dash .trow .sparkna{font-size:.72rem;color:var(--muted);}
  </style>
</head>
<body>
  <header>
    <div class="hrow">
      <div class="htitle">Share Scanner</div>
      <button class="hbtn" id="refresh">↻ Refresh</button>
    </div>
    <div class="subtle" id="dataAge">Loading…</div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="controls" id="controls" style="display:none">
    <input class="search" id="search" type="search" placeholder="Search ticker or name…" autocomplete="off" autocapitalize="characters">
    <div class="crow">
      <div class="seg" id="market"></div>
      <div class="scorewrap">
        <label id="scoreLabel">Score ≥</label>
        <input type="range" id="score" min="0" max="4" step="1" value="0">
        <span class="scoreval" id="scoreVal">0</span>
      </div>
    </div>
  </div>
  <div class="count" id="count"></div>
  <div class="hint" id="hint"></div>

  <div class="tablewrap"><div id="table"></div></div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-card">
      <div class="grip"></div>
      <div class="sheet-head">
        <div>
          <div class="tk" id="dTk"></div>
          <div class="nm" id="dNm"></div>
        </div>
        <button class="close" id="dClose" aria-label="Close">✕</button>
      </div>
      <div class="sheet-sub" id="dSub"></div>
      <div class="sheet-body" id="dBody"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const HIDDEN_COLS = new Set(["Notes/Error"]); // don't clutter the table with mostly-empty error text

  // Supplemental "What these mean" definitions for columns the scan's own legend
  // doesn't document. Only added if the scan has the column AND its legend lacks
  // it, so once a scanner's legend covers it, this quietly stops duplicating.
  const EXTRA_LEGEND = {
    "Analyst Upside %": "How far the analysts' average (mean) 12-month price target sits above today's price: (mean target price ÷ current price − 1) × 100, from Yahoo Finance's consensus. Positive = the average analyst target is above the current price (the quality score credits a positive upside). Blank if the stock has no analyst coverage.",
  };

  // The two strategies, each with a paired user-curated watchlist. Only these
  // scan keys are shown (the old defensive "watchlist" scan is no longer a tab).
  const STRATEGY_DEFS = [
    { key: "broad",    label: "150" },
    { key: "oversold", label: "Oversold" },
  ];

  const state = {
    data: null,
    scanKey: null,           // active strategy scan key: "broad" | "oversold"
    tabType: "strategy",     // "strategy" | "watchlist"
    minScore: 0,
    market: "All",
    query: "",
    sortCol: null,
    sortDir: "desc",
    detailView: localStorage.getItem("detail_view") || "overview",  // "overview" | "charts"
  };

  // ---- watchlists (persisted on THIS device) ----
  // Shape: { broad: {TICKER: {row:{...}, asOf:"..."}}, oversold: {...} }
  // Each entry caches the last-seen scan row so a ticker that later drops out
  // of the scan still shows its last-known data with an "as of" date.
  const WL_KEY = "scanner_watchlists";
  function loadWL() {
    try { return JSON.parse(localStorage.getItem(WL_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveWL(wl) { localStorage.setItem(WL_KEY, JSON.stringify(wl)); }
  function wlFor(key) { const wl = loadWL(); return wl[key] || {}; }
  function isWatched(key, ticker) { return !!wlFor(key)[ticker]; }
  function toggleWatch(key, ticker, row, stamp) {
    const wl = loadWL();
    if (!wl[key]) wl[key] = {};
    if (wl[key][ticker]) delete wl[key][ticker];
    else wl[key][ticker] = { row: row, asOf: stamp };
    saveWL(wl);
  }
  function scanStamp(scan) { return scan.last_run || (state.data && state.data.generated_at) || ""; }
  // On each data load, refresh the cached snapshot for any watched ticker that
  // appears in the newest scan (membership is kept regardless).
  function refreshWatchlistSnapshots() {
    const wl = loadWL();
    let changed = false;
    for (const def of STRATEGY_DEFS) {
      const scan = state.data.scans[def.key];
      if (!scan || !wl[def.key]) continue;
      const stamp = scanStamp(scan);
      const byTicker = new Map(scan.rows.map(r => [r.Ticker, r]));
      for (const tkr of Object.keys(wl[def.key])) {
        if (byTicker.has(tkr)) { wl[def.key][tkr] = { row: byTicker.get(tkr), asOf: stamp }; changed = true; }
      }
    }
    if (changed) saveWL(wl);
  }

  // ---- data loading (network-first; falls back to last saved copy offline) ----
  async function loadData(force) {
    try {
      const resp = await fetch("results.json", { cache: force ? "no-store" : "default" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      localStorage.setItem("scanner_data", JSON.stringify(data));
      applyData(data, false);
    } catch (e) {
      const saved = localStorage.getItem("scanner_data");
      if (saved) {
        applyData(JSON.parse(saved), true);
      } else {
        $("dataAge").textContent = "Couldn't load scan data (offline, nothing saved yet).";
        $("table").innerHTML = '<div class="msg">No data available.<br>Connect to the internet once to load the latest scans.</div>';
      }
    }
  }

  function applyData(data, offline) {
    state.data = data;
    const avail = STRATEGY_DEFS.map(d => d.key).filter(k => data.scans[k]);
    if (!state.scanKey || !data.scans[state.scanKey]) {
      state.scanKey = avail[0] || Object.keys(data.scans)[0];
    }
    refreshWatchlistSnapshots();
    $("dataAge").innerHTML = (offline ? '<span class="warn">Offline · </span>' : "") +
      "Published " + relAge(data.generated_at);
    renderTabs();
    resetControlsForScan();
    render();
  }

  // ---- helpers ----
  function relAge(iso) {
    if (!iso) return "unknown";
    const shown = iso.replace("T", " ").slice(0, 16);
    const then = new Date(iso), now = new Date();
    if (isNaN(then)) return shown;
    const days = Math.floor((now - then) / 86400000);
    let ago;
    if (days <= 0) {
      const hrs = Math.floor((now - then) / 3600000);
      ago = hrs <= 0 ? "just now" : hrs + "h ago";
    } else {
      ago = days === 1 ? "yesterday" : days + "d ago";
    }
    const stale = days >= 3 ? ' <span class="warn">· may be stale</span>' : "";
    return shown + " (" + ago + ")" + stale;
  }

  const isBoolCol = (col) => col.trim().endsWith("?");
  const isCapCol  = (col) => /cap/i.test(col);

  function scanMax(scan) {
    let m = 0;
    for (const r of scan.rows) {
      const v = r[scan.score_field];
      if (typeof v === "number" && v > m) m = v;
    }
    return m || 4;
  }

  function fmtCap(v) {
    const a = Math.abs(v);
    if (a >= 1e12) return (v/1e12).toFixed(2) + "T";
    if (a >= 1e9)  return (v/1e9 ).toFixed(2) + "B";
    if (a >= 1e6)  return (v/1e6 ).toFixed(1) + "M";
    return v.toLocaleString();
  }

  function cellHTML(col, v, scoreField, sMax) {
    if (v === null || v === undefined || v === "") return '<span class="muted">—</span>';
    if (isBoolCol(col)) {
      const truthy = v === true || v === 1 || v === "TRUE" || v === "True";
      const falsy  = v === false || v === 0 || v === "FALSE" || v === "False";
      if (truthy) return '<span class="yes">✓</span>';
      if (falsy)  return '<span class="no">✗</span>';
      return '<span class="muted">—</span>';
    }
    if (col === scoreField && typeof v === "number") {
      const ratio = sMax ? v / sMax : 0;
      const cls = ratio >= 0.66 ? "s-hi" : ratio <= 0.33 ? "s-lo" : "s-mid";
      return '<span class="pill ' + cls + '">' + v + "</span>";
    }
    if (typeof v === "number") {
      if (isCapCol(col)) return fmtCap(v);
      if (Number.isInteger(v) && Math.abs(v) >= 10000) return v.toLocaleString();
      return String(v);
    }
    return String(v);
  }

  // ---- rendering ----
  function renderTabs() {
    const tabs = $("tabs");
    tabs.innerHTML = "";
    for (const def of STRATEGY_DEFS) {
      if (!state.data.scans[def.key]) continue;
      // strategy tab
      addTab(tabs, def.label + " Strategy", "strategy", def.key,
             state.data.scans[def.key].rows.filter(r => typeof r[state.data.scans[def.key].score_field] === "number").length, false);
      // paired watchlist tab
      const n = Object.keys(wlFor(def.key)).length;
      addTab(tabs, def.label + " Watchlist", "watchlist", def.key, n, true);
    }
  }

  function addTab(container, label, type, key, count, isWL) {
    const b = document.createElement("button");
    const active = type === state.tabType && key === state.scanKey;
    b.className = "tab" + (active ? " active" : "");
    const star = isWL ? "★ " : "";
    const small = isWL ? '<small class="wl">' + star + count + "</small>"
                       : "<small>" + count + "</small>";
    b.innerHTML = label + " " + small;
    b.onclick = () => {
      state.scanKey = key; state.tabType = type;
      resetControlsForScan(); render(); renderTabs();
    };
    container.appendChild(b);
  }

  function resetControlsForScan() {
    const scan = state.data.scans[state.scanKey];
    const sMax = scanMax(scan);
    // Strategy: default to a shortlist near the top (max-1). Watchlist: show all
    // watched names (score >= 0), you curated them yourself.
    state.minScore = state.tabType === "watchlist" ? 0 : Math.max(0, sMax - 1);
    state.market = "All";
    state.query = "";
    state.sortCol = scan.score_field;
    state.sortDir = "desc";

    $("controls").style.display = "flex";
    $("search").value = "";

    // market segmented control (from the rows this tab can show)
    const src = state.tabType === "watchlist" ? watchlistRows().map(e => e.r) : scan.rows;
    const markets = ["All", ...Array.from(new Set(src.map(r => r.Market).filter(Boolean))).sort()];
    const seg = $("market");
    seg.innerHTML = "";
    for (const m of markets) {
      const b = document.createElement("button");
      b.textContent = m;
      b.className = m === state.market ? "on" : "";
      b.onclick = () => { state.market = m; syncSeg(); render(); };
      seg.appendChild(b);
    }
    // score slider
    const sl = $("score");
    sl.max = sMax; sl.value = state.minScore;
    $("scoreVal").textContent = state.minScore;
    $("scoreLabel").textContent = (scan.score_field.includes("Quality") ? "Quality ≥" : "Score ≥");
  }

  function syncSeg() {
    [...$("market").children].forEach(b => b.className = b.textContent === state.market ? "on" : "");
  }

  // Build watchlist entries for the active strategy: live scan row when the
  // ticker is still in the latest scan, else the cached snapshot (marked stale).
  function watchlistRows() {
    const key = state.scanKey;
    const scan = state.data.scans[key];
    const live = new Map(scan.rows.map(r => [r.Ticker, r]));
    const wl = wlFor(key);
    const stamp = scanStamp(scan);
    const out = [];
    for (const tkr of Object.keys(wl)) {
      if (live.has(tkr)) out.push({ r: live.get(tkr), stale: false, asOf: stamp });
      else out.push({ r: wl[tkr].row, stale: true, asOf: wl[tkr].asOf });
    }
    return out;
  }

  // Returns entries {r, stale, asOf} for the active tab, filtered + sorted.
  function currentRows() {
    const scan = state.data.scans[state.scanKey];
    const sf = scan.score_field;
    const q = state.query.trim().toLowerCase();
    const isWL = state.tabType === "watchlist";
    const stamp = scanStamp(scan);

    let entries = isWL
      ? watchlistRows()
      : scan.rows.map(r => ({ r, stale: false, asOf: stamp }));

    entries = entries.filter(({ r }) => {
      if (q) {
        // A ticker/name search finds the stock regardless of score slider or market.
        const hay = ((r.Ticker || "") + " " + (r.Name || "")).toLowerCase();
        return hay.includes(q);
      }
      const sv = r[sf];
      if (!isWL && typeof sv !== "number") return false;   // strategy: drop errored rows
      if (typeof sv === "number" && sv < state.minScore) return false;
      if (state.market !== "All" && r.Market !== state.market) return false;
      return true;
    });

    const col = state.sortCol, dir = state.sortDir === "asc" ? 1 : -1;
    entries.sort((A, B) => {
      let x = A.r[col], y = B.r[col];
      const xn = (x === null || x === undefined || x === ""), yn = (y === null || y === undefined || y === "");
      if (xn && yn) return 0;
      if (xn) return 1;        // nulls always last
      if (yn) return -1;
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x).localeCompare(String(y)) * dir;
    });
    return entries;
  }

  function render() {
    const scan = state.data.scans[state.scanKey];
    const sf = scan.score_field;
    const sMax = scanMax(scan);
    const isWL = state.tabType === "watchlist";
    // column order: Ticker, Name, <score>, then the rest (minus hidden & dupes)
    let cols = scan.columns.filter(c => !HIDDEN_COLS.has(c));
    // Ticker, Name, score, then % Below ATH + Analyst Upside (Oversold only), then the rest.
    const front = ["Ticker", "Name", sf, "% Below ATH", "Analyst Upside %"];
    cols = [...front.filter(c => cols.includes(c)), ...cols.filter(c => !front.includes(c))];

    const entries = currentRows();
    const byTkr = {};
    entries.forEach(e => { byTkr[e.r.Ticker] = e; });

    // count line
    if (isWL) {
      const total = Object.keys(wlFor(state.scanKey)).length;
      const staleN = entries.filter(e => e.stale).length;
      $("count").textContent = total === 0 ? "" :
        entries.length + " watched" + (staleN ? "  ·  " + staleN + " not in latest scan" : "");
    } else {
      $("count").textContent = entries.length + " of " +
        scan.rows.filter(r => typeof r[sf] === "number").length + " shown" +
        (scan.last_run ? "  ·  scan run " + scan.last_run : "");
    }

    // empty watchlist (nothing added yet)
    if (isWL && Object.keys(wlFor(state.scanKey)).length === 0) {
      const label = STRATEGY_DEFS.find(d => d.key === state.scanKey).label;
      $("table").innerHTML = '<div class="emptywl"><span class="big">☆</span>' +
        "Your " + label + " watchlist is empty.<br>Open the <b>" + label +
        " Strategy</b> tab and tap the ☆ next to a stock to add it here.</div>";
      $("hint").textContent = "";
      return;
    }

    let html = "<table><thead><tr>";
    cols.forEach((c, i) => {
      const arrow = c === state.sortCol ? (state.sortDir === "asc" ? " ▲" : " ▼") : "";
      let thc = i === 0 ? "sticky" : "";
      if (c === "Name") thc += " name";
      const label = esc(c) + '<span class="arrow">' + arrow + "</span>";
      // Ticker/Name stay on one line (left labels); value headers wrap via .thw.
      const inner = (i === 0 || c === "Name") ? label : '<span class="thw">' + label + "</span>";
      html += '<th class="' + thc.trim() + '" data-col="' + esc(c) + '">' + inner + "</th>";
    });
    html += "</tr></thead><tbody>";
    entries.forEach((e, ri) => {
      html += '<tr data-idx="' + ri + '"' + (e.stale ? ' class="stale"' : "") + ">";
      cols.forEach((c, i) => {
        let cls = i === 0 ? "sticky" : "";
        if (c === "Name") cls += " name";
        if (c === sf) cls += " score";
        let inner;
        if (i === 0) {
          const tkr = e.r.Ticker;
          const watched = isWatched(state.scanKey, tkr);
          inner = '<span class="tkcell"><span class="star ' + (watched ? "on" : "") +
                  '" data-tkr="' + esc(tkr) + '">' + (watched ? "★" : "☆") + "</span>" +
                  esc(tkr) + (e.stale ? ' <span class="staleflag" title="Not in latest scan">⚠</span>' : "") +
                  "</span>";
        } else {
          inner = cellHTML(c, e.r[c], sf, sMax);
        }
        html += '<td class="' + cls.trim() + '">' + inner + "</td>";
      });
      html += "</tr>";
    });
    html += "</tbody></table>";
    if (entries.length === 0) html = '<div class="msg">No matches. Lower the score filter or clear the search.</div>';
    $("table").innerHTML = html;

    // header sort handlers
    document.querySelectorAll("thead th").forEach(th => {
      th.onclick = () => {
        const c = th.getAttribute("data-col");
        if (state.sortCol === c) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
        else { state.sortCol = c; state.sortDir = (c === "Ticker" || c === "Name") ? "asc" : "desc"; }
        render();
      };
    });
    // star tap -> add/remove from this strategy's watchlist (don't open detail)
    document.querySelectorAll(".star[data-tkr]").forEach(el => {
      el.onclick = (ev) => {
        ev.stopPropagation();
        const tkr = el.getAttribute("data-tkr");
        toggleWatch(state.scanKey, tkr, byTkr[tkr].r, scanStamp(scan));
        renderTabs(); render();
      };
    });
    // row tap -> detail sheet
    document.querySelectorAll("tbody tr[data-idx]").forEach(tr => {
      tr.onclick = () => openDetail(entries[+tr.getAttribute("data-idx")]);
    });
    $("hint").textContent = entries.length
      ? (isWL ? "Tap ★ to remove · tap a row for details" : "Tap ☆ to watch · tap a row for details")
      : "";
  }

  // ---- fundamentals dashboard (Oversold names) ----
  // A scan can show the charts view when it carries fundamentals.
  function scanHasFundamentals(scan) {
    return scan.columns.includes("ROE %") || scan.columns.includes("Profit Margin %");
  }

  // Small inline sparkline for a multi-year series (nulls allowed). Coloured by
  // overall direction (first→last), paired with a ▲/▼ value so it's never colour-alone.
  function sparklineSVG(vals) {
    const pts = [];
    (vals || []).forEach((v, i) => { if (v !== null && v !== undefined) pts.push({ i, v }); });
    if (pts.length < 2) return '<span class="sparkna">— not enough history —</span>';
    const n = (vals.length - 1) || 1;
    const ys = pts.map(p => p.v);
    let lo = Math.min(...ys), hi = Math.max(...ys);
    if (lo === hi) { lo -= 1; hi += 1; }
    const W = 100, H = 26, pad = 3;
    const X = (i) => (i / n) * (W - 2 * pad) + pad;
    const Y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - 2 * pad);
    const line = pts.map((p, k) => (k ? "L" : "M") + X(p.i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
    const up = pts[pts.length - 1].v >= pts[0].v;
    const col = up ? "var(--good)" : "var(--bad)";
    const last = pts[pts.length - 1];
    const area = "M" + X(pts[0].i).toFixed(1) + " " + (H - pad) + " " +
      pts.map(p => "L" + X(p.i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ") +
      " L" + X(last.i).toFixed(1) + " " + (H - pad) + " Z";
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<path d="' + area + '" fill="' + col + '" opacity="0.13"/>' +
      '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + X(last.i).toFixed(1) + '" cy="' + Y(last.v).toFixed(1) +
      '" r="2.3" fill="' + col + '" stroke="var(--bg)" stroke-width="1"/></svg>';
  }

  function trendRow(label, vals, fmt) {
    const pts = (vals || []).filter(v => v !== null && v !== undefined);
    if (pts.length < 2)
      return '<div class="trow"><div class="tk2">' + label + '</div>' +
             '<span class="sparkna">— n/a —</span><div class="tvv na">n/a</div></div>';
    const up = pts[pts.length - 1] >= pts[0];
    const cls = up ? "up" : "down";
    return '<div class="trow"><div class="tk2">' + label + '</div>' +
      sparklineSVG(vals) +
      '<div class="tvv ' + cls + '">' + (up ? "▲ " : "▼ ") + fmt(pts[pts.length - 1]) + "</div></div>";
  }

  function dashboardHTML(r) {
    const scanObj = state.data.scans[state.scanKey];
    const hist = (scanObj && scanObj.history || {})[r.Ticker];
    const g = (k) => r[k];                       // raw getter by column name
    const nn = (v) => v !== null && v !== undefined && v !== "";
    const num = (v) => (typeof v === "number" ? v : null);

    // quality ring numerator/denominator (denominator parsed from "12/12")
    const q = num(g("Quality Score"));
    let qd = 12;
    const qstr = g("Quality (of known criteria)");
    if (typeof qstr === "string" && qstr.includes("/")) qd = parseInt(qstr.split("/")[1], 10) || qd;

    function ring() {
      if (!nn(q)) return "";
      const pct = qd ? q / qd : 0, R = 20, C = 2 * Math.PI * R, off = C * (1 - pct);
      const col = pct >= 0.75 ? "var(--good)" : pct >= 0.4 ? "var(--dmid)" : "var(--bad)";
      return '<div style="text-align:center;flex:none;margin-left:auto">' +
        '<svg width="52" height="52" viewBox="0 0 52 52">' +
        '<circle cx="26" cy="26" r="' + R + '" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/>' +
        '<circle cx="26" cy="26" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="5" stroke-linecap="round" ' +
        'stroke-dasharray="' + C + '" stroke-dashoffset="' + off + '" transform="rotate(-90 26 26)"/>' +
        '<text x="26" y="24" text-anchor="middle" fill="var(--text)" font-size="15" font-weight="700">' + q + '</text>' +
        '<text x="26" y="35" text-anchor="middle" fill="var(--muted)" font-size="8">of ' + qd + '</text></svg>' +
        '<div style="font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Quality</div></div>';
    }
    function tile(label, v, unit, cls) {
      if (!nn(v)) return '<div class="tile na"><div class="tk">' + label + '</div><div class="tv">n/a</div></div>';
      return '<div class="tile ' + (cls || "") + '"><div class="tk">' + label + '</div>' +
             '<div class="tv">' + v + '<small>' + (unit || "") + '</small></div></div>';
    }
    function mbar(label, v, unit, max, thr, higherBetter) {
      if (!nn(v)) return '<div class="mrow"><div class="mk2">' + label + '</div><div class="bw"></div><div class="mv na">n/a</div></div>';
      const w = Math.max(2, Math.min(100, (v / max) * 100));
      const good = higherBetter === false ? v <= thr : v >= thr;
      const thrPct = Math.min(100, (thr / max) * 100);
      return '<div class="mrow"><div class="mk2">' + label + '</div>' +
        '<div class="bw"><div class="f ' + (good ? "good" : "mag") + '" style="width:' + w + '%"></div>' +
        '<div class="thr" style="left:' + thrPct + '%"></div></div><div class="mv">' + v + unit + '</div></div>';
    }
    function growth(label, v) {
      let bar, val;
      if (!nn(v)) {
        bar = '<div class="neg"></div><div class="pos"></div>';
        val = '<span class="dvv na">n/a</span>';
      } else {
        const mag = Math.min(100, Math.abs(v) / 25 * 100);
        if (v >= 0) {
          bar = '<div class="neg"></div><div class="pos"><div class="f" style="width:' + mag + '%"></div></div>';
          val = '<span class="dvv up">▲ ' + v + '%</span>';
        } else {
          bar = '<div class="neg"><div class="f" style="width:' + mag + '%"></div></div><div class="pos"></div>';
          val = '<span class="dvv down">▼ ' + v + '%</span>';
        }
      }
      return '<div class="dv"><div class="dk">' + label + '</div>' + bar + val + "</div>";
    }
    function track() {
      const lo = num(g("52wk Low")), hi = num(g("52wk High")), p = num(g("Price")), ath = num(g("All-Time High"));
      if (!nn(lo) || !nn(hi) || !nn(p)) return "";
      const top = nn(ath) ? Math.max(ath, hi) : hi, span = top - lo || 1;
      const pos = (x) => Math.max(0, Math.min(100, ((x - lo) / span) * 100));
      // Keep edge labels on-screen: left-align near 0%, right-align near 100%,
      // centre in between (a plain translateX(-50%) clips "52w low" off the left).
      const capT = (x) => x < 12 ? "translateX(0)" : x > 88 ? "translateX(-100%)" : "translateX(-50%)";
      const pl = pos(lo), ph = pos(hi), pp = pos(p);
      let h = '<div class="track"><div class="bar"></div>' +
        '<div class="fill" style="width:' + pp + '%"></div>' +
        '<div class="mk" style="left:' + pp + '%"></div>' +
        '<div class="cap" style="left:' + pl + '%;transform:' + capT(pl) + '">52w low</div>' +
        '<div class="cap" style="left:' + ph + '%;transform:' + capT(ph) + '">52w high</div>' +
        '<div class="cap val" style="left:' + pp + '%;transform:' + capT(pp) + '">' + p + '</div>';
      if (nn(ath)) { const pa = pos(ath);
        // If ATH sits close to the 52w-high label, lift it onto a second line
        // so the two never merge into one another.
        const lift = Math.abs(pa - ph) < 16 ? ";top:-30px" : "";
        h += '<div class="mk ath" style="left:' + pa + '%"></div>' +
             '<div class="cap" style="left:' + pa + '%;transform:' + capT(pa) + ';color:var(--bad)' + lift + '">ATH</div>'; }
      return h + "</div>";
    }

    const belowATH = num(g("% Below ATH")), mc = num(g("Market Cap"));
    const pe = num(g("Trailing P/E")), fpe = num(g("Forward P/E")), peg = num(g("PEG"));
    const anyFund = nn(g("ROE %")) || nn(g("Profit Margin %")) || nn(g("ROIC %"));

    let h = '<div class="dash">';
    if (ring()) h += '<div style="display:flex;align-items:flex-start;gap:.7rem">' +
      '<div style="flex:1"><div class="st" style="margin-top:.2rem">Price vs range</div></div>' + ring() + '</div>';
    else h += '<div class="st">Price vs range</div>';
    h += track();
    if (nn(belowATH)) h += '<div class="headline"><span class="big">−' + belowATH + '%</span>' +
      '<span class="cap">below all-time high' + (nn(mc) ? ' · mkt cap ' + fmtCap(mc) : "") + '</span></div>';

    h += '<div class="st">Valuation</div><div class="tiles">' +
      tile("Trailing P/E", pe) +
      tile("Forward P/E", fpe, "", (nn(fpe) && nn(pe) && fpe < pe) ? "good" : "") +
      tile("PEG", peg, "", nn(peg) ? (peg < 1 ? "good" : peg > 2 ? "bad" : "") : "") +
      tile("P/B", num(g("P/B"))) +
      tile("Div Yield", num(g("Div Yield %")), "%") +
      tile("Analyst upside", num(g("Analyst Upside %")), "%", (num(g("Analyst Upside %")) > 0) ? "good" : "") +
      "</div>";

    if (anyFund) {
      h += '<div class="st">Returns &amp; margin</div>' +
        mbar("ROE", num(g("ROE %")), "%", 60, 15, true) +
        mbar("ROIC", num(g("ROIC %")), "%", 60, 12, true) +
        mbar("ROCE", num(g("ROCE %")), "%", 60, 12, true) +
        mbar("Profit margin", num(g("Profit Margin %")), "%", 40, 10, true) +
        '<div class="st">Growth (YoY)</div>' +
        growth("Revenue", num(g("Revenue Gr YoY %"))) +
        growth("Earnings", num(g("Earnings Gr YoY %"))) +
        '<div class="st">Financial health</div>' +
        mbar("Debt/Equity", num(g("Debt/Equity")), "", 200, 100, false) +
        mbar("Int. cover", num(g("Interest Coverage (x)")), "×", 40, 3, true);
    } else {
      h += '<div class="dnote">Limited fundamentals reported for this name (common for REITs &amp; some financials). Showing price, valuation and quality signals only.</div>';
    }

    // Multi-year trends (populated by the scan; absent on names with no history yet)
    if (hist && hist.years && hist.years.length >= 2) {
      const yrs = hist.years;
      h += '<div class="st">Trends · FY ' + esc(yrs[0]) + "–" + esc(yrs[yrs.length - 1]) + "</div>";
      h += trendRow("Revenue", hist.revenue, fmtCap);
      h += trendRow("Earnings", hist.netIncome, fmtCap);
      h += trendRow("Margin", hist.margin, (v) => v + "%");
      h += trendRow("ROE", hist.roe, (v) => v + "%");
    }
    return h + "</div>";
  }

  // ---- detail sheet ----
  function openDetail(entry) {
    const r = entry.r;
    const scan = state.data.scans[state.scanKey];
    const sf = scan.score_field;
    const sMax = scanMax(scan);
    const cols = scan.columns;

    $("dTk").textContent = r.Ticker || "";
    $("dNm").textContent = r.Name || "";

    // sub-line: market · sector · sub-industry + score pill
    const bits = ["Market", "Sector", "Sub-Industry"]
      .map(k => r[k]).filter(v => v && String(v).trim());
    const sv = r[sf];
    const ratio = (typeof sv === "number" && sMax) ? sv / sMax : 0;
    const scls = ratio >= 0.66 ? "s-hi" : ratio <= 0.33 ? "s-lo" : "s-mid";
    $("dSub").innerHTML =
      bits.map(b => '<span class="badge">' + esc(b) + "</span>").join("") +
      (typeof sv === "number"
        ? '<span class="bigscore ' + scls + '">' + esc(sf.replace(/\s*\(.*\)/, "")) + ": " + sv + "</span>"
        : "");

    const identity = new Set(["Ticker", "Name", "Market", "Sector", "Sub-Industry", sf, "Notes/Error"]);
    const signalCols = cols.filter(c => isBoolCol(c));
    const metricCols = cols.filter(c => !identity.has(c) && !isBoolCol(c));

    let html = "";
    // watch toggle for the active strategy's watchlist
    const stratLabel = STRATEGY_DEFS.find(d => d.key === state.scanKey).label;
    const watched = isWatched(state.scanKey, r.Ticker);
    html += '<button class="watchbtn ' + (watched ? "on" : "") + '" id="dWatch">' +
      (watched ? "★ Watching " + stratLabel + " — tap to remove"
               : "☆ Add to " + stratLabel + " Watchlist") + "</button>";
    if (entry.stale) {
      html += '<div class="stalebanner">Not in the latest scan · data as of ' +
              esc(entry.asOf || "unknown") + "</div>";
    }
    // per-stock actions: copy a search-friendly symbol (for Trading 212's search)
    // and a chart link to Yahoo Finance using the exact ticker we hold.
    const clean = (r.Ticker || "").split(".")[0];
    const yurl = "https://finance.yahoo.com/quote/" + encodeURIComponent(r.Ticker || "");
    html += '<div class="actions">' +
      '<button class="actbtn" id="dCopy" data-copy="' + esc(clean) + '">⧉ Copy ' + esc(clean) + "</button>" +
      '<a class="actbtn" href="' + esc(yurl) + '" target="_blank" rel="noopener">Chart ↗</a>' +
      "</div>" +
      '<div class="acthint">Copy → paste into Trading 212 search · Chart opens Yahoo Finance</div>';

    // Charts view is available for scans that carry fundamentals (Oversold).
    const canChart = scanHasFundamentals(scan);
    if (canChart) {
      html += '<div class="viewtoggle" id="dViewToggle">' +
        '<button data-view="overview" class="' + (state.detailView === "overview" ? "on" : "") + '">📋 Numbers</button>' +
        '<button data-view="charts" class="' + (state.detailView === "charts" ? "on" : "") + '">📊 Charts</button></div>';
    }

    if (canChart && state.detailView === "charts") {
      html += dashboardHTML(r);
    } else {
      // Numbers view: signal chips + full metric list (also the only view for the 150 scan)
      if (signalCols.length) {
        html += '<div class="sec-title">Signals</div><div class="signals">';
        for (const c of signalCols) {
          const v = r[c];
          const truthy = v === true || v === 1 || v === "TRUE" || v === "True";
          const falsy  = v === false || v === 0 || v === "FALSE" || v === "False";
          const cls = truthy ? "pass" : falsy ? "fail" : "unk";
          const mark = truthy ? "✓" : falsy ? "✗" : "—";
          html += '<span class="sig ' + cls + '">' + mark + " " + esc(c.replace(/\?$/, "")) + "</span>";
        }
        html += "</div>";
      }
      if (metricCols.length) {
        html += '<div class="sec-title">Metrics</div><div class="metrics">';
        for (const c of metricCols) {
          html += '<div class="k">' + esc(c) + '</div><div class="v">' +
                  cellHTML(c, r[c], sf, sMax) + "</div>";
        }
        html += "</div>";
      }
    }
    const note = r["Notes/Error"];
    if (note && String(note).trim()) {
      html += '<div class="notes">' + esc(String(note)) + "</div>";
    }
    if (scan.legend && scan.legend.length) {
      const documented = new Set(scan.legend.map(([f]) => f));
      const merged = [...scan.legend];
      for (const [f, def] of Object.entries(EXTRA_LEGEND)) {
        if (scan.columns.includes(f) && !documented.has(f)) merged.push([f, def]);
      }
      html += '<details class="method"><summary>What these mean</summary><dl class="method">';
      for (const [field, def] of merged) {
        html += "<dt>" + esc(field) + "</dt><dd>" + esc(def) + "</dd>";
      }
      html += "</dl></details>";
    }
    $("dBody").innerHTML = html;
    $("dBody").scrollTop = 0;
    $("sheet").hidden = false;

    const wb = $("dBody").querySelector("#dWatch");
    if (wb) wb.onclick = () => {
      toggleWatch(state.scanKey, r.Ticker, r, scanStamp(scan));
      renderTabs(); render();
      openDetail(entry);   // rebuild the sheet so the button label flips, keep it open
    };
    const cp = $("dBody").querySelector("#dCopy");
    if (cp) cp.onclick = () => copyText(cp.getAttribute("data-copy"));
    const vt = $("dBody").querySelector("#dViewToggle");
    if (vt) vt.querySelectorAll("button").forEach(b => b.onclick = () => {
      state.detailView = b.getAttribute("data-view");
      localStorage.setItem("detail_view", state.detailView);
      openDetail(entry);   // rebuild the sheet in the chosen view
    });
  }

  // ---- clipboard + toast ----
  function copyText(t) {
    const done = () => showToast("Copied " + t);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
    } else {
      fallbackCopy(t, done);
    }
  }
  function fallbackCopy(t, done) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); done();
  }
  function showToast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove("show"), 1500);
  }

  function closeDetail() { $("sheet").hidden = true; }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // ---- events ----
  $("search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
  $("score").addEventListener("input", (e) => {
    state.minScore = +e.target.value; $("scoreVal").textContent = e.target.value; render();
  });
  $("refresh").addEventListener("click", () => {
    $("dataAge").textContent = "Refreshing…";
    loadData(true);
    // also check for a new app version; if found it auto-reloads via controllerchange
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistration().then((r) => r && r.update());
    }
  });
  $("dClose").addEventListener("click", closeDetail);
  $("sheetBackdrop").addEventListener("click", closeDetail);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

  // ---- boot ----
  loadData(false);
  if ("serviceWorker" in navigator) {
    // If this page is already controlled by a SW, a newer SW taking over means a
    // fresh app version is ready - reload once so it shows immediately.
    let refreshing = false;
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then((reg) => reg.update().catch(() => {}))   // check for a new version each open
        .catch(() => {});
    });
  }
  </script>
</body>
</html>
